# Leak-scanner rules for this repo (workspace Git plan, lock 3).
# The pre-commit hook and every full scan use this file.
#
# It runs gitleaks' full default rule set, PLUS the extra rules below. To silence a
# false positive, add the narrowest allowlist entry that works, with a comment
# saying why. Never allowlist a whole folder that could one day hold a real key.

title = "lead-gen-automation-engine"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Anthropic keys are NOT in gitleaks 8.30.1's default rule set. Measured
# 2026-10-12: a fake sk-ant-api03-... key was staged and the default rules
# returned "no leaks found", so the commit was allowed. Keys for GitHub, OpenAI,
# Langfuse, Google and Instantly were all caught; only Anthropic was missed.
# These projects use ANTHROPIC_API_KEY more than any other key, so the hook was
# blind to the most likely leak until this rule was added.
#
# The {32,} length is deliberate: a real key is ~100 characters after sk-ant-,
# while the placeholders in the .env.example files are far shorter, so they do
# not trip the scanner. It also covers sk-ant-admin01- keys, because the
# character class allows the hyphen.
# ---------------------------------------------------------------------------
[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key (sk-ant-...)"
regex = '''sk-ant-[A-Za-z0-9_\-]{32,}'''
keywords = ["sk-ant-"]
